name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [Ai_brench]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Ordinary changes must not build an APK. Add the marker only for a requested build.
    if: >-
      github.ref == 'refs/heads/Ai_brench' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build apk]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: '26.1.10909125'
    outputs:
      apk_sha256: ${{ steps.signed_apk.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and NDK
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' "ndk;$ANDROID_NDK_VERSION"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Install Qt 6.8.3 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools
          cache: true

      - name: Test maps and taxi destinations
        shell: bash
        run: |
          cmake -S tests/navigation -B build-navigation-tests \
            -DCMAKE_PREFIX_PATH="$QT_HOST_PATH"
          cmake --build build-navigation-tests --parallel 2
          ctest --test-dir build-navigation-tests --output-on-failure

      - name: Python 3.12 for Qt UI tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test contact input and taxi UI
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python3 -m venv "$RUNNER_TEMP/ui-tests"
          "$RUNNER_TEMP/ui-tests/bin/pip" install 'PySide6-Essentials==6.8.3'
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
            "$RUNNER_TEMP/ui-tests/bin/python" tests/ui/test_contacts_search.py
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
            "$RUNNER_TEMP/ui-tests/bin/python" tests/ui/test_taxi_ui.py

      - name: Configure
        shell: bash
        run: |
          # Every new run and retry has a higher code within this workflow.
          # A rerun of an older run remains an older version.
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo "Too many retries for the version-code range"
            exit 1
          fi
          version_code=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "WEEKENDSWAY_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWEEKENDSWAY_VERSION_CODE="$version_code" \
            -DWEEKENDSWAY_VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            -DANDROID_ABI=arm64-v8a

      - name: Build APK
        run: cmake --build build --target apk --parallel 2

      - name: Sign and verify update-compatible APK
        id: signed_apk
        shell: bash
        env:
          WEEKENDSWAY_SIGNING_JSON: ${{ secrets.WEEKENDSWAY_SIGNING_JSON }}
        run: |
          mapfile -t apks < <(find build -type f -path '*/outputs/apk/debug/*.apk' | sort)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected one debug APK, found ${#apks[@]}"
            exit 1
          fi
          python3 scripts/sign_android_apk.py \
            --input "${apks[0]}" --output dist/WeekendsWay-arm64-v8a.apk \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --version-code "$WEEKENDSWAY_VERSION_CODE"
          apk_sha256=$(sha256sum dist/WeekendsWay-arm64-v8a.apk | cut -d ' ' -f 1)
          echo "sha256=$apk_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekendsWay-android-arm64-apk
          path: dist/WeekendsWay-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish-apk:
    name: Save APK in Ai_brench
    needs: android
    if: github.repository == 'Halma1996/WeekendsWay' && github.ref == 'refs/heads/Ai_brench'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout built source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: WeekendsWay-android-arm64-apk
          path: dist

      - name: Verify and prepare repository APK
        shell: bash
        env:
          EXPECTED_APK_SHA256: ${{ needs.android.outputs.apk_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re

          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['GITHUB_REF']
          source_sha = os.environ['GITHUB_SHA']
          expected = os.environ['EXPECTED_APK_SHA256']
          if repo != 'Halma1996/WeekendsWay' or ref != 'refs/heads/Ai_brench':
              raise SystemExit('APK publication is restricted to Halma1996/WeekendsWay Ai_brench')
          if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('Invalid source commit')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('Missing or invalid signed APK digest')
          apk = Path('dist/WeekendsWay-arm64-v8a.apk').read_bytes()
          actual = hashlib.sha256(apk).hexdigest()
          if actual != expected:
              raise SystemExit('Downloaded APK does not match the signed build')

          version = f"1.1.{int(os.environ['GITHUB_RUN_NUMBER'])}.{int(os.environ['GITHUB_RUN_ATTEMPT'])}"
          run_url = f"https://github.com/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          target = Path('apk')
          target.mkdir(exist_ok=True)
          (target / 'WeekendsWay-latest.apk').write_bytes(apk)
          (target / 'WeekendsWay-latest.apk.sha256').write_text(
              f'{actual}  WeekendsWay-latest.apk\n', encoding='utf-8')
          (target / 'README.md').write_text(
              '# WeekendsWay APK\n\n'
              '[Скачать APK](WeekendsWay-latest.apk)\n\n'
              f'Версия: **{version}**. Android 9+, **arm64-v8a**.\n\n'
              'APK подписан постоянным ключом проекта. Идентификатор пакета: '
              '`org.qtproject.example.WeekendsWay`.\n\n'
              f'Исходный код: [{source_sha}](https://github.com/{repo}/commit/{source_sha}).\n\n'
              f'[Сборка GitHub Actions]({run_url}).\n\n'
              f'SHA-256: `{actual}`.\n\n'
              'Установка и работа на физическом Android-устройстве этой сборкой не проверяются.\n',
              encoding='utf-8')
          print(f'Prepared APK {version}: {len(apk)} bytes, SHA-256 {actual}')
          PY

      - name: Commit APK only to Ai_brench
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'Halma1996/WeekendsWay' ]]
          [[ "$GITHUB_REF" == 'refs/heads/Ai_brench' ]]
          git fetch origin Ai_brench --depth=1
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Ai_brench advanced after this build; refusing to publish an outdated APK'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apk/WeekendsWay-latest.apk apk/WeekendsWay-latest.apk.sha256 apk/README.md
          if git diff --cached --quiet; then
            echo 'Repository APK is already current'
            exit 0
          fi
          git commit -m "Update APK 1.1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} [skip ci]"
          git push origin HEAD:refs/heads/Ai_brench
