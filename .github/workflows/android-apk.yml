name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [Ai_brench]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.ref == 'refs/heads/Ai_brench'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: '26.1.10909125'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and NDK
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' "ndk;$ANDROID_NDK_VERSION"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Install Qt 6.8.3 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools
          cache: true

      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: weekendsway-android-debug-keystore-v1

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            -DANDROID_ABI=arm64-v8a

      - name: Build APK
        run: cmake --build build --target apk --parallel 2

      - name: Verify and collect APK
        shell: bash
        run: |
          mapfile -t apks < <(find build -type f -path '*/outputs/apk/debug/*.apk' | sort)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected one debug APK, found ${#apks[@]}"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "${apks[0]}"
          mkdir -p dist
          cp "${apks[0]}" dist/WeekendsWay-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekendsWay-android-arm64-apk
          path: dist/WeekendsWay-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
