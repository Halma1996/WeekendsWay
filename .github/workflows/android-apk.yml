name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [Ai_brench]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Ordinary changes must not build an APK. Add the marker only for a requested build.
    if: >-
      github.ref == 'refs/heads/Ai_brench' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build apk]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: '26.1.10909125'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and NDK
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' "ndk;$ANDROID_NDK_VERSION"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Install Qt 6.8.3 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools
          cache: true

      - name: Test map selection and provider links
        shell: bash
        run: |
          cmake -S tests/navigation -B build-navigation-tests \
            -DCMAKE_PREFIX_PATH="$QT_HOST_PATH"
          cmake --build build-navigation-tests --parallel 2
          ctest --test-dir build-navigation-tests --output-on-failure

      - name: Python 3.12 for Qt UI tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test contact search with composing keyboard input
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python3 -m venv "$RUNNER_TEMP/ui-tests"
          "$RUNNER_TEMP/ui-tests/bin/pip" install 'PySide6-Essentials==6.8.3'
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
            "$RUNNER_TEMP/ui-tests/bin/python" tests/ui/test_contacts_search.py

      - name: Configure
        shell: bash
        run: |
          # Every new run and retry has a higher code within this workflow.
          # A rerun of an older run remains an older version.
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo "Too many retries for the version-code range"
            exit 1
          fi
          version_code=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "WEEKENDSWAY_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWEEKENDSWAY_VERSION_CODE="$version_code" \
            -DWEEKENDSWAY_VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            -DANDROID_ABI=arm64-v8a

      - name: Build APK
        run: cmake --build build --target apk --parallel 2

      - name: Sign and verify update-compatible APK
        shell: bash
        env:
          WEEKENDSWAY_SIGNING_JSON: ${{ secrets.WEEKENDSWAY_SIGNING_JSON }}
        run: |
          mapfile -t apks < <(find build -type f -path '*/outputs/apk/debug/*.apk' | sort)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected one debug APK, found ${#apks[@]}"
            exit 1
          fi
          python3 scripts/sign_android_apk.py \
            --input "${apks[0]}" --output dist/WeekendsWay-arm64-v8a.apk \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --version-code "$WEEKENDSWAY_VERSION_CODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeekendsWay-android-arm64-apk
          path: dist/WeekendsWay-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true
